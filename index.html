has not yet broken ground?"},{id:"ch1",num:"Chapter 1",title:"Money Answereth All Things",stageIdx:0,scripture:"A feast is made for laughter, and wine maketh merry: but money answereth all things.",scriptureRef:"Ecclesiastes 10:19",content:["Solomon was not materialistic. He was legislative. He understood that in the realm of men, many prayers are answered by provision, many visions die for lack of funding, and many mantles are limited by purse.","To despise money is to despise a tool of dominion. The early church did not only pray — they had all things common because they had sold and brought value into motion. Money answered.","This law is brutal in its fairness: If you do not have an answer for money, money will not have an answer for you. It is not emotional. It is legal."],reflection:"Where are you expecting God to answer what money was designed to answer?"},{id:"ch2",num:"Chapter 2",title:"Covenant, Not Promise",stageIdx:0,scripture:"But thou shalt remember the Lord thy God: for it is he that giveth thee power to get wealth, that he may establish his covenant.",scriptureRef:"Deuteronomy 8:18",content:["God does not give you money. He gives you POWER to get wealth. Power is ability, skill, idea, capacity. And the reason is covenant — not comfort, not luxury.","A promise excites you. A covenant binds you. Wealth is not a promise to claim; it is a covenant to keep. Covenant has terms: obedience, stewardship, seed, timing.","Many are waiting for a promise when they should be entering a covenant. Covenants require kneeling first. Hence KneelBooks. Dominion comes after bowing."],reflection:"What covenant practice have you replaced with wishful promise-thinking?"},{id:"ch3",num:"Chapter 3",title:"Life is a Marketplace",stageIdx:1,scripture:"And he called his ten servants, and delivered them ten pounds, and said unto them, Occupy till I come.",scriptureRef:"Luke 19:13",content:["You were born into a marketplace. Your gifts are goods. Your time is currency. Your reputation is credit. From Eden, man was told to dress and keep — to work and manage.","Heaven trades in value. The parable of the talents is not about talent shows. It is about market occupation. The master did not ask, 'Did you pray?' He asked, 'What did you gain by trading?'","If you do not understand that life is exchange, you will live as a beggar in a marketplace, praying for free goods."],reflection:"What specific product or service are you currently trading in the marketplace of men?"},{id:"ch4",num:"Chapter 4",title:"The Poverty of Imagination",stageIdx:1,scripture:"Where there is no vision, the people perish.",scriptureRef:"Proverbs 29:18",content:["Poverty is not first a lack of money. It is a lack of imagination. Money follows picture. What you cannot see, you cannot seize.","The African mentality that cries 'there is no money' is actually confessing 'there is no image'. Imagination is the womb of wealth. Every building was first a mental image.","God showed Abraham stars before giving him a son. He had to enlarge imagination before he could enlarge estate. Your bank account will never outgrow your mind's picture."],reflection:"Describe in one sentence the picture of wealth your mind can currently sustain without guilt."},{id:"ch5",num:"Chapter 5",title:"Value Determines Wealth",stageIdx:2,scripture:"Buy the truth, and sell it not.",scriptureRef:"Proverbs 23:23",content:["Wealth does not come by prayer alone. It comes by value. The market does not pay you for your need. It pays you for your value. Your anointing must become useful to men.","Jesus turned water to wine — value addition. He fed five thousand — value multiplication. Every miracle of provision was value created. God is the first value-adder.","Stop asking, 'How can I get money?' Ask, 'What valuable problem can I solve?' Value is currency. Money is just the receipt."],reflection:"List three problems you can solve today that people will thank you for with money."},{id:"ch6",num:"Chapter 6",title:"The Product Principle",stageIdx:2,scripture:"Seest thou a man diligent in his business? he shall stand before kings.",scriptureRef:"Proverbs 22:29",content:["Your gift is not enough. It must become a product. A gift blesses you. A product blesses others — and brings kings.","David's harp was a gift. His sling was a product. One entertained Saul. The other killed Goliath and brought a throne. Many gifted people remain poor because they never packaged their gift.","KneelBooks is a product principle house. We take revelation and make it readable, holdable, sellable. Seed must become tree, then fruit, then product."],reflection:"What is one gift you have that you have not yet packaged into a product this month?"},{id:"ch7",num:"Chapter 7",title:"Motional Money",stageIdx:3,scripture:"The wealth of the sinner is laid up for the just... and he that gathereth by labour shall increase.",scriptureRef:"Proverbs 13:22, 11",content:["Money is motional. It moves. Static money dies. In the parable, the servant who buried his talent was called wicked. Not poor — wicked. Because he stopped motion.","Seed must move from hand to ground. Idea must move from mind to market. Value must move from hidden to seen. Motion is the law of increase. Faith without movement is dead.","African wealth is often buried — in land not used, in ideas not launched, in anointing not monetized. God loves motion. The Spirit moved upon waters before creation happened."],reflection:"What money, idea, or product have you buried that needs motion this week?"},{id:"ch8",num:"Chapter 8",title:"African Mentality and Money",stageIdx:3,scripture:"My people are destroyed for lack of knowledge.",scriptureRef:"Hosea 4:6",content:["There is a mentality that celebrates suffering and suspects wealth. It says, 'Money is evil.' It quotes 'money is the root of all evil' but omits 'love of'. It spiritualizes poverty.","This mentality waits for abroad, waits for government, waits for uncle. It consumes seed. It does not plant. It begs for harvest without covenant.","The generals taught us different: Humility, not inferiority. Frugality, not poverty. Wealth as tool for kingdom, not as god. We must unlearn begging to learn building."],reflection:"What phrase about money did you inherit from culture that you must now renounce?"},{id:"ch9",num:"Chapter 9",title:"Faith Plus Brain",stageIdx:4,scripture:"Wisdom is the principal thing; therefore get wisdom: and with all thy getting get understanding.",scriptureRef:"Proverbs 4:7",content:["Faith does not replace brain. Faith engages brain. God gave you faith for the invisible and brain for the practical. You need both to build.","Many believers are faithful but foolish — praying for money without a budget, fasting for business without a plan, speaking in tongues without speaking to customers.","The generals prayed all night and worked all day. They kneel and they build. KneelBooks believes in bended knee and sharpened mind. Anointing plus strategy equals dominion."],reflection:"What practical skill must your faith fund and learn in the next 30 days?"},{id:"ch10",num:"Chapter 10",title:"Guard Your Value",stageIdx:4,scripture:"Keep thy heart with all diligence; for out of it are the issues of life.",scriptureRef:"Proverbs 4:23",content:["Your value leaks through unguarded gates: wrong relationships, loose talk, cheap pricing, procrastination, and dishonor of time.","If you do not guard your value, the market will devalue you. People pay for what you protect. Diamonds are guarded. Gold is vaulted. Your gift must be stewarded, not scattered.","Learn to say no. Learn to price well. Learn to rest. Learn to hide seed until season. Not every opportunity is covenantal."],reflection:"Where is your value currently leaking without protection?"},{id:"ch11",num:"Chapter 11",title:"Marriage, Relationships and Money",stageIdx:4,scripture:"Can two walk together, except they be agreed?",scriptureRef:"Amos 3:3",content:["Money problems are often marriage problems in disguise. Two visions of money cannot build one house. If you marry a spender while you are a sower, you will war over seed.","Relationships are either assets or liabilities. Some friends multiply you. Others divide you. Your circle determines your ceiling. Value attracts value.","Choose a partner who understands covenant economics — that we build, not just bill. That we save seed, sow seed, and celebrate fruit together."],reflection:"Does your closest circle multiply your value or manage your poverty?"},{id:"ch12",num:"Chapter 12",title:"Mentorship, Systems and Dominion",stageIdx:4,scripture:"And ye shall be as gods, knowing... Be fruitful, and multiply, and replenish the earth, and subdue it.",scriptureRef:"Genesis 3:5, 1:28",content:["Dominion is the endgame. Not survival. Not success. Dominion. To subdue systems, to replenish earth, to rule your sphere. But dominion needs mentorship and systems.","The generals taught us by kneeling — they showed that power flows through submission. Mentorship is how dominion transfers. You cannot dominate what you have not learned under.","Systems outlive strength. Build structures: books, businesses, schools, farms, banks, platforms. The seed becomes a tree so that other seeds can find shade. That is dominion."],reflection:"What system are you building that will outlive your own strength?"},{id:"epilogue",num:"Epilogue",title:"Final Laws",stageIdx:4,scripture:"The silver is mine, and the gold is mine, saith the Lord of hosts.",scriptureRef:"Haggai 2:8",content:["Final laws, simple and binding:","1. Money obeys covenant, not crying. 2. Value precedes wealth. 3. Product makes you stand before kings. 4. Money must move to multiply. 5. Imagination is the first currency. 6. Guard what God gave you. 7. Dominion is the mandate, not money.","You started this book as a seed. If you have read with humility and with hunger, you are now a sapling. Stay planted. Keep kneeling. The tree will come. And trees don't beg for fruit — they become the source of it."],reflection:"Write your own 7th law of money from your life experience."}];var mP=KA(Yf(),1),M5=Symbol.for("react.element");var a5=Object.prototype.hasOwnProperty,c5=mP.__SECRET_INTERNALS_DO_NOT_USE_OR_YOU_WILL_BE_FIRED.ReactCurrentOwner,o5={key:!0,ref:!0,__self:!0,__source:!0};function qP(A,f,e){var v,n={},r=null,t=null;e!==void 0&&(r=""+e),f.key!==void 0&&(r=""+f.key),f.ref!==void 0&&(t=f.ref);for(v in f)a5.call(f,v)&&!o5.hasOwnProperty(v)&&(n[v]=f[v]);if(A&&A.defaultProps)for(v in f=A.defaultProps,f)n[v]===void 0&&(n[v]=f[v]);return{$$typeof:M5,type:A,key:r,ref:t,props:n,_owner:c5.current}}var u=qP,x=qP;var mn=[pn,QP,hP,RP,BP],Vv=["Seed","Sprout","Sapling","Growth","Tree"];function qn({title:A,author:f,size:e="sm",id:v}){let n=A.toLowerCase().includes("welcome"),r=A.toLowerCase().includes("laws of money"),t=e==="lg"?"w-[280px] md:w-[320px]":"w-full",z=e==="lg"?"h-[400px] md:h-[460px]":"h-[220px]";if(n)return x("div",{className:`${t} ${z} rounded-[16px] overflow-hidden relative flex flex-col items-center justify-center p-6 text-center shadow-[inset_0_1px_1px_rgba(255,255,255,0.15),0_8px_24px_rgba(0,0,0,0.18)]`,style:{background:"#1a1a1a"},children:[u("div",{className:"absolute inset-0 bg-gradient-to-br from-white/[0.06] to-transparent pointer-events-none"}),x("div",{className:"relative z-10 flex flex-col items-center gap-4",children:[u("img",{src:qv,alt:"KneelBooks",className:"w-10 h-10 object-contain opacity-90 invert"}),x("h2",{className:"font-['Cormorant_Garamond'] font-bold text-[20px] leading-[1.1] tracking-[0.08em] text-[#f5f1e8] uppercase",children:["WELCOME",u("br",{}),"TO",u("br",{}),"KNEELBOOKS"]}),u("div",{className:"w-8 h-[1px] bg-white/20 mt-2"}),u("span",{className:"text-[9px] tracking-[0.2em] text-white/40 uppercase",children:"Beginning Edition"})]}),u("div",{className:"absolute bottom-4 left-0 right-0 text-center",children:u("span",{className:"text-[10px] tracking-[0.15em] text-white/30 uppercase",children:"KneelBooks • 2025"})})]}
