<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fefefe">
<title>Library</title>
<style>
:root{--bg:#fefefe;--text:#111;--navy:#0F1A2E;--line:#E8E6E1;--mute:#6B6B6B;--faint:#9A9A9A;--ink:#1A1A1A;--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:Georgia,"Times New Roman",serif;-webkit-font-smoothing:antialiased;padding-top:var(--safe-top)}
::selection{background:var(--navy);color:#fff}
.sans{font-family:Inter,system-ui,-apple-system,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:0 24px calc(96px + var(--safe-bottom))}
@media(min-width:768px){.wrap{padding-left:32px;padding-right:32px}}
.pill{display:inline-flex;align-items:center;gap:12px;border:1px solid var(--line);padding:6px 16px}
.pill span{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--mute);font-weight:500}
.pill i{width:1px;height:12px;background:var(--line)}
.top{display:flex;justify-content:center;padding:48px 0 40px}
@media(min-width:768px){.top{padding-top:80px}}
header.h{text-align:center;padding-bottom:56px;border-bottom:1px solid var(--line);margin-bottom:56px}
h1{font-size:28px;letter-spacing:.18em;text-transform:uppercase;font-variant:small-caps;color:var(--navy);font-weight:400;line-height:1.15}
@media(min-width:768px){h1{font-size:34px}}
.rule{margin-top:12px;display:flex;align-items:center;justify-content:center;gap:16px}
.rule b{height:1px;width:32px;background:rgba(15,26,46,.2)}
.rule span{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--mute);font-weight:500}
.sub{margin-top:24px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
h2.sec{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--navy);font-weight:600;margin-bottom:32px}
.shelf{display:grid;grid-template-columns:1fr 1fr;gap:32px 24px}
@media(max-width:420px){.shelf{gap:28px 16px}}
.book{display:block;text-decoration:none;color:inherit;cursor:pointer;background:none;border:0;text-align:left;font:inherit}
.cover{position:relative;aspect-ratio:2/3;width:100%;overflow:hidden;box-shadow:0 20px 60px -24px rgba(15,26,46,.25),0 1px 0 0 rgba(0,0,0,.06);transition:transform .25s ease,box-shadow .25s ease}
.cover:after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.04);pointer-events:none}
.book:hover .cover,.book:focus-visible .cover{transform:translateY(-4px);box-shadow:0 28px 60px -22px rgba(15,26,46,.35),0 1px 0 0 rgba(0,0,0,.06)}
.book:focus-visible{outline:1px solid var(--navy);outline-offset:6px}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.kcover{background:#0b0b0b;color:#f2efe9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center}
.kcover .k{font-size:clamp(15px,3.6vw,21px);letter-spacing:.2em;text-transform:uppercase;font-variant:small-caps}
.kcover .l{width:32px;height:1px;background:rgba(242,239,233,.35)}
.kcover .t{font-size:9px;letter-spacing:.28em;text-transform:uppercase;color:rgba(242,239,233,.55);font-family:Inter,system-ui,sans-serif}
.meta{margin-top:18px}
.meta .n{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--navy);font-variant:small-caps}
.meta .a{margin-top:6px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.meta .d{margin-top:8px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
footer.f{margin-top:96px;padding-top:40px;border-top:1px solid rgba(232,230,225,.6);display:flex;justify-content:space-between;gap:24px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#A8A8A8;line-height:1.6;flex-wrap:wrap}
/* reader */
#reader{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;padding-top:var(--safe-top);z-index:20}
#reader.on{display:flex}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;height:48px;padding:0 16px;border-bottom:1px solid var(--line);flex:none}
.bar button,.bar a{background:none;border:0;font:inherit;cursor:pointer;color:var(--navy);text-decoration:none;font-size:10px;letter-spacing:.22em;text-transform:uppercase;font-weight:500;font-family:Inter,system-ui,sans-serif;padding:8px 4px}
.bar .ttl{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);font-variant:small-caps;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center;flex:1}
.bar a{color:var(--mute)}
#frame{flex:1;width:100%;border:0;background:#fff;padding-bottom:var(--safe-bottom)}
</style>
</head>
<body>
<div class="wrap" id="lib">
  <div class="top"><div class="pill"><span>Library</span><i></i><span>books to read</span></div></div>
  <header class="h">
    <h1>The Library</h1>
    <div class="rule"><b></b><span>2 Books</span><b></b></div>
    <p class="sub">Choose a book to begin reading</p>
  </header>
  <h2 class="sec">Shelf</h2>
  <div class="shelf" id="shelf"></div>
  <footer class="f">
    <div><p>Library</p><p style="margin-top:4px">A growing collection</p></div>
    <div><p>More books coming soon</p></div>
  </footer>
</div>

<div id="reader" aria-hidden="true">
  <div class="bar">
    <button id="back" aria-label="Back to library">← Library</button>
    <div class="ttl" id="rt"></div>
    <a id="ext" target="_blank" rel="noopener">Open ↗</a>
  </div>
  <iframe id="frame" title="Book reader" allow="fullscreen"></iframe>
</div>

<script>
var BOOKS=[
 {id:"the-deep",title:"The Deep",tag:"Book One",author:"MJ Diphoko",desc:"A Horama",src:"The-Deep.html",cover:"cover.jpg"},
 {id:"kneelbooks",title:"Kneelbooks",tag:"Reading app",author:"Kneelbooks",desc:"Open the reader",src:"https://mahlatseeducation-ops.github.io/kneelbooks-/",cover:null}
];
var shelf=document.getElementById('shelf'),reader=document.getElementById('reader'),frame=document.getElementById('frame');
BOOKS.forEach(function(b){
  var el=document.createElement('button');el.className='book';el.setAttribute('aria-label','Open '+b.title);
  var c=b.cover?'<div class="cover"><img src="'+b.cover+'" alt="'+b.title+' cover"></div>'
    :'<div class="cover kcover"><span class="t">Reading app</span><span class="l"></span><span class="k">'+b.title+'</span><span class="l"></span><span class="t">Open to read</span></div>';
  el.innerHTML=c+'<div class="meta"><div class="n">'+b.title+'</div><div class="a">by '+b.author+'</div><div class="d">'+b.tag+'</div></div>';
  el.onclick=function(){location.hash=b.id};
  shelf.appendChild(el);
});
function route(){
  var id=location.hash.slice(1),b=BOOKS.filter(function(x){return x.id===id})[0];
  if(b){
    document.getElementById('rt').textContent=b.title;
    document.getElementById('ext').href=b.src;
    if(frame.getAttribute('data-id')!==b.id){frame.src=b.src;frame.setAttribute('data-id',b.id)}
    reader.classList.add('on');reader.setAttribute('aria-hidden','false');
  }else{
    reader.classList.remove('on');reader.setAttribute('aria-hidden','true');
    frame.removeAttribute('src');frame.removeAttribute('data-id');
  }
}
document.getElementById('back').onclick=function(){history.length>1?history.back():(location.hash='')};
window.addEventListener('hashchange',route);route();
</script>
</body>
</html>
